dialog.about.text=An engineer goes down into Kessel Deep, a mine under the ice of a frozen moon, where the control system called the Foreman has turned the machines against the crew. Nine levels in three sections, with tools for weapons.
dialog.about.keys=W A S D walk, the mouse or the arrows turn, Shift runs. Click or Ctrl uses the tool, 1 to 6 or the wheel choose one. Space opens doors and works the lift. Tab shows the map, P pauses.
