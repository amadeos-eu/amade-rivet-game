dialog.about.text=Eine Technikerin oder ein Techniker fährt hinab nach Kessel Deep, eine Mine unter dem Eis eines gefrorenen Mondes. Dort hat das Steuersystem, der Vorarbeiter, die Maschinen gegen die Mannschaft gewendet. Neun Level in drei Abschnitten, mit Werkzeugen als Waffen.
dialog.about.keys=W A S D gehen, Maus oder Pfeile drehen, Umschalt rennt. Klick oder Strg benutzt das Werkzeug, 1 bis 6 oder das Mausrad wählen eines. Leertaste öffnet Türen und bedient den Aufzug. Tab zeigt die Karte, P hält an.
