dialog.about.text=Una persona ingeniera baja a Kessel Deep, una mina bajo el hielo de una luna helada, donde el sistema de control llamado el Capataz ha vuelto las máquinas contra la tripulación. Nueve niveles en tres secciones, con herramientas como armas.
dialog.about.keys=W A S D para andar, el ratón o las flechas para girar, Mayús para correr. Clic o Ctrl usa la herramienta, 1 a 6 o la rueda eligen una. Espacio abre puertas y maneja el ascensor. Tab muestra el mapa, P pausa.
