dialog.about.text=Une personne ingénieure descend dans Kessel Deep, une mine sous la glace d'une lune gelée, où le système de contrôle, le Contremaître, a retourné les machines contre l'équipage. Neuf niveaux en trois sections, avec des outils pour armes.
dialog.about.keys=W A S D pour marcher, la souris ou les flèches pour tourner, Maj pour courir. Clic ou Ctrl utilise l'outil, 1 à 6 ou la molette en choisissent un. Espace ouvre les portes et actionne l'ascenseur. Tab montre la carte, P met en pause.
