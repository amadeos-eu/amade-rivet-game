dialog.about.text=Una persona ingegnere scende a Kessel Deep, una miniera sotto il ghiaccio di una luna gelata, dove il sistema di controllo chiamato il Caposquadra ha rivolto le macchine contro l'equipaggio. Nove livelli in tre sezioni, con attrezzi come armi.
dialog.about.keys=W A S D per camminare, il mouse o le frecce per girare, Maiusc per correre. Clic o Ctrl usa l'attrezzo, da 1 a 6 o la rotella ne scelgono uno. Spazio apre le porte e aziona l'ascensore. Tab mostra la mappa, P mette in pausa.
